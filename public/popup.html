<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Time</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark">ST</div>
        <div>
          <p class="eyebrow">Daily attention</p>
          <h1>Screen Time</h1>
        </div>
        <button id="toggle-block-all" class="block-all" type="button">Block everything</button>
      </header>

      <section class="meter" aria-label="Today's usage">
        <div>
          <span class="label">Used today</span>
          <div class="elapsed-row">
            <strong id="elapsed">0:00</strong>
            <button
              id="toggle-block-tracked"
              class="pause"
              type="button"
              aria-pressed="false"
              aria-label="Block tracked sites"
              title="Block tracked sites"
            >
              <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="3.5" y="2.5" width="3" height="11" rx="1" />
                <rect x="9.5" y="2.5" width="3" height="11" rx="1" />
              </svg>
              <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M4.5 2.8v10.4a.8.8 0 0 0 1.2.7l8.3-5.2a.8.8 0 0 0 0-1.4L5.7 2.1a.8.8 0 0 0-1.2.7z"
                />
              </svg>
            </button>
          </div>
        </div>
        <span id="remaining" class="remaining">Loading</span>
      </section>
      <div class="tab-row">
        <p id="state-label" class="tab-state">Checking this tab...</p>
        <button id="toggle-tab" class="secondary" type="button" hidden>
          Stop tracking this tab
        </button>
      </div>

      <form id="settings-form">
        <label for="daily-limit">Daily allowance</label>
        <div class="limit-row">
          <input
            id="daily-limit"
            name="daily-limit"
            type="number"
            min="1"
            max="1440"
            step="1"
            required
          />
          <span>minutes</span>
          <button id="reset-today" class="secondary reset" type="button">Reset today</button>
        </div>

        <label class="checkbox" for="show-badge">
          <input id="show-badge" name="show-badge" type="checkbox" />
          Show remaining minutes on toolbar icon
        </label>

        <label for="hostnames">Tracked sites</label>
        <textarea
          id="hostnames"
          name="hostnames"
          rows="5"
          spellcheck="false"
          placeholder="example.com&#10;news.example.org"
        ></textarea>
        <p class="hint">
          One hostname per line. Subdomains are included. Tabs opened from tracked tabs inherit
          tracking.
        </p>

        <div class="form-footer">
          <span id="feedback" role="status"></span>
          <button type="submit">Save settings</button>
        </div>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
